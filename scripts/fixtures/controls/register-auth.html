<!doctype html>
<html><body>
<main id="auth">
  <h1>Create account to continue applying</h1>
  <button type="button" id="google">Continue with Google</button>
  <div class="or">or</div>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" />
  <label for="password2">Confirm password</label>
  <input id="password2" name="password_confirmation" type="password" autocomplete="new-password" />
  <button type="button" id="register">Create account</button>
</main>
</body></html>
