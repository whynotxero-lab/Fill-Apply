<form id="app">
  <fieldset>
    <legend>Are you authorized to work in this country?</legend>
    <label><input type="radio" name="auth" value="yes" /> Yes</label>
    <label><input type="radio" name="auth" value="no" /> No</label>
  </fieldset>
  <fieldset>
    <legend>Do you require sponsorship?</legend>
    <input type="radio" name="sponsor" id="sp_yes" value="Yes" />
    <label for="sp_yes">Yes</label>
    <input type="radio" name="sponsor" id="sp_no" value="No" />
    <label for="sp_no">No</label>
  </fieldset>
</form>
