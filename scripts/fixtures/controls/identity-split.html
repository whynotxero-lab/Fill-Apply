<!doctype html>
<html><body>
<form id="app">
  <label for="full">Full name</label>
  <input id="full" name="full_name" />
  <label for="first">First name</label>
  <input id="first" name="first_name" />
  <label for="last">Last name</label>
  <input id="last" name="last_name" />
  <label for="dob">Date of birth</label>
  <input id="dob" name="date_of_birth" placeholder="MM/DD/YYYY" />
  <label for="nat">Nationality</label>
  <select id="nat" name="nationality">
    <option value="">Select</option>
    <option value="Pakistani">Pakistani</option>
    <option value="Pakistan">Pakistan</option>
    <option value="Indian">Indian</option>
  </select>
  <label for="res">Country of residence</label>
  <select id="res" name="country_of_residence">
    <option value="">Select</option>
    <option value="United Arab Emirates">United Arab Emirates</option>
    <option value="Emirati">Emirati</option>
    <option value="Pakistan">Pakistan</option>
  </select>
  <label for="cc">Country code</label>
  <select id="cc" name="phone_country">
    <option value="">Select</option>
    <option value="+971">+971 United Arab Emirates</option>
    <option value="+92">+92 Pakistan</option>
  </select>
  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" />
  <label for="resume">Upload Resume / CV</label>
  <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" />
</form>
</body></html>
