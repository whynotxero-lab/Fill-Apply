<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fill &amp; Apply</title>
    <link rel="icon" href="../brand/favicon.ico" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="shell">
      <header class="brand-header sticky-header thin-header">
        <img class="brand-logo" src="../icons/icon48.png" width="28" height="28" alt="" />
        <div class="brand-text">
          <h1>Fill &amp; Apply</h1>
          <p class="tagline" id="extVersionTag">v1.11.1</p>
        </div>
      </header>

      <div class="scroll-body">
        <section class="panel lean">
          <label class="grow">Select profile
            <select id="profileSelect" aria-label="Select profile"></select>
          </label>
          <p id="summary" class="summary compact">Loading…</p>

          <fieldset class="mode-fieldset">
            <legend>Application mode</legend>
            <div class="mode-seg" role="radiogroup" aria-label="Application mode">
              <label class="mode-seg-item">
                <input type="radio" name="runMode" value="fill" checked />
                <span class="mode-seg-label">
                  <strong>Fill</strong>
                  <small>Fields</small>
                </span>
              </label>
              <label class="mode-seg-item">
                <input type="radio" name="runMode" value="ready" />
                <span class="mode-seg-label">
                  <strong>Ready</strong>
                  <small>+ Next</small>
                </span>
              </label>
              <label class="mode-seg-item">
                <input type="radio" name="runMode" value="submit" />
                <span class="mode-seg-label">
                  <strong>Submit</strong>
                  <small>E2E</small>
                </span>
              </label>
            </div>
          </fieldset>

          <fieldset class="mode-fieldset">
            <legend>Runner mode</legend>
            <div class="mode-seg" role="radiogroup" aria-label="Runner mode">
              <label class="mode-seg-item">
                <input type="radio" name="runnerMode" value="single" checked />
                <span class="mode-seg-label">
                  <strong>Single</strong>
                  <small>This page</small>
                </span>
              </label>
              <label class="mode-seg-item">
                <input type="radio" name="runnerMode" value="batch" />
                <span class="mode-seg-label">
                  <strong>Batch</strong>
                  <small>Queue</small>
                </span>
              </label>
            </div>
          </fieldset>

          <div id="emptyQueuePrompt" class="empty-queue-prompt" hidden>
            <p>No URLs in the queue — run Fill &amp; Apply on the current page?</p>
            <div class="btn-row">
              <button type="button" id="btnEmptyYes" class="primary">Yes</button>
              <button type="button" id="btnEmptyNo" class="secondary">No — open Options</button>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" id="btnStart" class="primary">Start runner</button>
            <button type="button" id="btnStop" class="danger">Stop</button>
          </div>

          <p id="runState" class="run-state">Idle</p>
          <div id="pauseBanner" class="pause-banner" hidden>
            <p id="pauseMessage" class="pause-message">Paused — verify Cloudflare/CAPTCHA</p>
            <button type="button" id="btnResume" class="primary resume-btn">Resume</button>
          </div>

          <div id="queueStatus" class="bucket-pills" aria-live="polite">
            <span class="pill pill-queued"><span class="pill-label">Q</span> <strong id="countQueued">—</strong></span>
            <span class="pill pill-applied"><span class="pill-label">A</span> <strong id="countApplied">—</strong></span>
            <span class="pill pill-failed"><span class="pill-label">F</span> <strong id="countFailed">—</strong></span>
            <span class="pill pill-cancelled"><span class="pill-label">C</span> <strong id="countCancelled">—</strong></span>
          </div>
          <p id="lastJobTitle" class="muted last-job" hidden></p>
          <p id="lastError" class="err-line" hidden></p>

          <div class="live-log-wrap">
            <strong class="live-log-title">Live log</strong>
            <div id="liveLog" class="live-log"></div>
          </div>

          <label class="row check compact-check">
            <input type="checkbox" id="highlightUnmatched" />
            Highlight unmatched
          </label>

          <div class="btn-row">
            <button type="button" id="btnOptions" class="secondary">Open options</button>
          </div>
          <p class="hint-mini">Delay, caps, keep-tabs, documents, and queue URLs live in Options.</p>
        </section>

        <p id="status" class="status" role="status"></p>

        <!-- Hidden compatibility hooks for panel-app (settings moved to Options) -->
        <input type="hidden" id="delaySec" value="3" />
        <input type="checkbox" id="autoCloseAppliedTab" checked hidden />
        <input type="hidden" id="keepRecentTabs" value="5" />
        <input type="checkbox" id="autoPdfReport" checked hidden />
        <input type="hidden" id="capAshby" value="2" />
        <input type="hidden" id="capIndeed" value="2" />
        <input type="hidden" id="capGreenhouse" value="2" />
        <input type="hidden" id="capLever" value="2" />
        <input type="hidden" id="capDefault" value="2" />
        <button type="button" id="btnFill" hidden>Fill</button>
        <button type="button" id="btnSeed" hidden>Seed</button>
        <button type="button" id="btnResetMock" hidden>Reset</button>
        <button type="button" id="btnLastReport" hidden>Report</button>
        <ul id="recentReports" hidden></ul>
      </div>
    </div>

    <script src="../lib/types.js"></script>
    <script src="../lib/profile.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="../lib/files.js"></script>
    <script src="../ui/panel-app.js"></script>
  </body>
</html>
